<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SL Music Player</title>

<style>
body{
background:#111;
color:white;
font-family:Arial;
text-align:center;
padding-top:30px;
}

#player{
width:350px;
margin:auto;
background:#1c1c1c;
padding:20px;
border-radius:12px;
}

button{
background:#333;
color:white;
border:none;
padding:10px 15px;
margin:5px;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#555;
}

#progress{
width:100%;
}

#title{
margin-bottom:10px;
font-size:18px;
}
</style>
</head>

<body>

<div id="player">

<div id="title">Loading...</div>

<audio id="audio"></audio>

<input type="range" id="progress" value="0" min="0" max="100">

<div>
<span id="current">0:00</span> /
<span id="duration">0:00</span>
</div>

<div>
<button onclick="prev()">⏮</button>
<button onclick="toggle()">▶ / ⏸</button>
<button onclick="next()">⏭</button>
</div>

</div>

<script>

let playlist = [
{
title:"A La Bonne Croquette",
url:"https://ozibus-ai.github.io/sl-player/music/a-la-bonne-croquette.mp3"
},

{
title:"Biouby Halloween",
url:"https://ozibus-ai.github.io/sl-player/music/biouby-halloween.mp3"
},

{
title:"Le Playmobil",
url:"https://ozibus-ai.github.io/sl-player/music/le-playmobil.mp3"
}
];

let index = 0;

let audio = document.getElementById("audio");
let progress = document.getElementById("progress");
let title = document.getElementById("title");

function loadSong(i){

index = i;

audio.src = playlist[index].url;
title.innerText = playlist[index].title;

audio.load();
audio.play();
}

function toggle(){

if(audio.paused)
audio.play();
else
audio.pause();

}

function next(){

index++;

if(index >= playlist.length)
index = 0;

loadSong(index);

}

function prev(){

index--;

if(index < 0)
index = playlist.length-1;

loadSong(index);

}

audio.addEventListener("timeupdate",()=>{

let percent = (audio.currentTime/audio.duration)*100;

progress.value = percent;

document.getElementById("current").innerText =
formatTime(audio.currentTime);

document.getElementById("duration").innerText =
formatTime(audio.duration);

});

progress.addEventListener("input",()=>{

audio.currentTime =
(progress.value/100)*audio.duration;

});

function formatTime(t){

let m = Math.floor(t/60);
let s = Math.floor(t%60);

if(s<10) s="0"+s;

return m+":"+s;

}

loadSong(0);

</script>

</body>
</html>
